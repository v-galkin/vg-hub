events {}

http {
    include /etc/nginx/mime.types;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name vg-portfolio.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name vg-portfolio.duckdns.org;
        resolver 127.0.0.11 valid=30s;

        ssl_certificate     /etc/letsencrypt/live/vg-portfolio.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vg-portfolio.duckdns.org/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # PORTFOLIO
        location /api {
            set $upstream http://portfolio-backend:8080;
            proxy_pass $upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }
        location / {
            root /usr/share/nginx/html/portfolio;
            try_files $uri $uri/ /index.html;
        }
    }
}
