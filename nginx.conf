events {}
http {
    include /etc/nginx/mime.types;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name vg-portfolio.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name vg-portfolio.duckdns.org;
        resolver 127.0.0.11 valid=30s;

        ssl_certificate     /etc/letsencrypt/live/vg-portfolio.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vg-portfolio.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # PORTFOLIO
        location /api {
            set $upstream http://portfolio-backend:8080;
            proxy_pass $upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }
        location / {
            root /usr/share/nginx/html/portfolio;
            try_files $uri $uri/ /index.html;
        }

        # SENTINEL
        location /sentinel/api/ {
            set $upstream http://sentinel-backend:8081;
            proxy_pass $upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /sentinel/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /sentinel/index.html;
        }

        # SNIPPETS
        location /snippets/api/ {
            proxy_pass http://snippets-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }
        location /snippets/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /snippets/index.html;
        }

        # Weather Metrics
        location /weather/ {
            set $upstream http://weather-service:8000;
            rewrite ^/weather/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
    }
}
    
